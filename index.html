body{background:#101016;color:#cfcfd8;display:flex;min-height:100vh;flex-direction:column}

p{line-height:1.7;margin-bottom:12px}
.grid{display:flex;flex-direction:column;gap:20px}.box{background:#08080c;border:1px solid #222;border-radius:8px;padding:15px}
.box-title{background:#e63946;color:white;text-align:center;padding:7px;border-radius:4px;margin-bottom:10px;font-weight:bold}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1c1c24;font-size:.9rem}
.overlay{display:none;position:fixed;top:55px;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:900}.overlay.active{display:block}
@media(min-width:901px){.header{display:none}aside{top:0;transform:none!important}main{margin-left:300px;padding:40px}.grid{display:grid;grid-template-columns:1fr 330px;gap:30px}.overlay{display:none!important}}
</style>
