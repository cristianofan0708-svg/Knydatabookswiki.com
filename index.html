<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon Slayer: Kimetsu no Yaiba - Comprehensive Databook Encyclopedia</title>
    <style>
        :root {
            --bg-darker: #08080a;
            --bg-main: #101014;
            --bg-card: #181822;
            --bg-hover: #222230;
            --text-pure: #ffffff;
            --text-body: #cfcfd8;
            --text-muted: #858594;
            --brand-crimson: #e63946;
            --brand-flame: #ff5e13;
            --brand-blood: #9a031e;
            --border-muted: #252533;
            --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-stack);
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-body);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Design */
        aside {
            width: 290px;
            background-color: var(--bg-darker);
            border-right: 1px solid var(--border-muted);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .brand-header {
            padding: 24px;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-pure);
            border-bottom: 1px solid var(--border-muted);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--brand-crimson), var(--brand-flame));
            width: 12px;
            height: 12px;
            border-radius: 3px;
            transform: rotate(45deg);
        }

        .nav-sections {
            list-style: none;
            padding: 20px 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .nav-category {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            padding: 12px 24px 6px 24px;
        }

        .nav-item {
            padding: 10px 24px;
            cursor: pointer;
            color: var(--text-body);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--text-pure);
            background-color: var(--bg-card);
            border-left: 4px solid var(--brand-crimson);
            padding-left: 20px;
        }

        /* Main Windows Layout */
        main {
            margin-left: 290px;
            flex-grow: 1;
            width: calc(100% - 290px);
            padding: 40px;
            min-height: 100vh;
        }

        .search-container {
            position: relative;
            margin-bottom: 40px;
            max-width: 650px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            background-color: var(--bg-darker);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            color: var(--text-pure);
            font-size: 0.95rem;
        }

        .search-container::before {
            content: "🔍";
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
        }

        /* Dynamic Grid Framework */
        .wiki-page-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 40px;
        }

        .article-body h1 {
            font-size: 2.6rem;
            color: var(--text-pure);
            font-weight: 800;
            margin-bottom: 4px;
        }

        .article-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-header {
            font-size: 1.3rem;
            color: var(--brand-flame);
            margin: 30px 0 15px 0;
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 6px;
            text-transform: uppercase;
        }

        .article-body p {
            line-height: 1.8;
            margin-bottom: 16px;
            color: #c4c4cf;
        }

        /* Databook Info Card Box */
        .wiki-infobox {
            background-color: var(--bg-darker);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            padding: 18px;
            align-self: start;
        }

        .infobox-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-pure);
            background: linear-gradient(90deg, var(--brand-crimson), var(--brand-blood));
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .infobox-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #161622;
            font-size: 0.88rem;
        }

        .infobox-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .infobox-value {
            color: var(--text-pure);
            text-align: right;
        }

        /* Databook Statistics Bars */
        .stat-container {
            margin-top: 15px;
        }

        .stat-row {
            margin-bottom: 12px;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .stat-bar-outer {
            background-color: #222230;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-bar-inner {
            background: linear-gradient(90deg, var(--brand-flame), var(--brand-crimson));
            height: 100%;
            border-radius: 4px;
        }

        /* Lists and Cards Layout */
        .databook-list {
            margin-left: 20px;
            margin-bottom: 20px;
        }

        .databook-list li {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .badge {
            background-color: var(--bg-card);
            border: 1px solid var(--border-muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--brand-flame);
            font-weight: bold;
        }
    </style>
</head>
