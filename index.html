<style>
body{background:#101016;color:#cfcfd8;margin:0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;background:#08080c;padding:15px 20px;border-bottom:1px solid #222;position:sticky;top:0;z-index:1100}
.menu-btn{background:#e63946;color:#fff;border:0;padding:8px 14px;border-radius:4px;font-weight:bold;cursor:pointer}
aside{width:300px;background:#08080c;position:fixed;top:55px;bottom:0;left:0;z-index:1000;overflow-y:auto;transition:.3s;border-right:1px solid #222}
aside.hidden{transform:translateX(-100%)}
.item{padding:11px 20px;cursor:pointer;color:#a0a0ab;border-left:3px solid transparent}
.item.active{background:#1b1b22;color:#fff;border-left-color:#e63946}
.category{font-size:.7rem;color:#666;padding:14px 20px 4px;text-transform:uppercase;font-weight:700}
main{padding:20px;flex:1}
.page{display:none}.page.active{display:block}
h1{color:#fff}.sub{color:#666;font-size:.8rem;margin-bottom:20px;text-transform:uppercase}
h2{color:#ff5e13;margin:20px 0 10px;border-bottom:1px solid #222;padding-bottom:5px;text-transform:uppercase}
p{line-height:1.7;margin-bottom:12px}
.grid{display:flex;flex-direction:column;gap:20px}.box{background:#08080c;border:1px solid #222;border-radius:8px;padding:15px}
.box-title{background:#e63946;color:#fff;text-align:center;padding:7px;border-radius:4px;margin-bottom:10px;font-weight:bold}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222;font-size:.9rem}
.overlay{display:none;position:fixed;top:55px;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:900}.overlay.active{display:block}
@media(min-width:901px){.header{display:none}aside{top:0;transform:none!important}main{margin-left:300px;padding:40px}.grid{display:grid;grid-template-columns:1fr 330px}.overlay{display:none!important}}
</style>
